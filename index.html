backdrop-filter: blur(5px);

/* =====================================================================
   C. AUTHENTICATION FUNCTIONS
   ===================================================================== */
async function login(){
  const username = document.getElementById("username").value.trim();
  const password = document.getElementById("password").value;
  const role = document.getElementById("role").value;
  const msgEl = document.getElementById("loginMsg");
  const loginBtn = document.getElementById("loginBtn");

  msgEl.textContent = "";

  if(!username || !password){
    msgEl.textContent = "Please enter both username and password.";
    return;
  }

  loginBtn.disabled = true;
  loginBtn.textContent = "Signing in...";

  try{
    const { data, error } = await db
      .from("users")
      .select("*")
      .ilike("username", username)
      .eq("password", password)
      .ilike("role", role)
      .single();

    if(error || !data){
      console.error("Supabase login error:", error);
      let detail = "";
      if(error && error.code === "PGRST116"){
        detail = " (no matching row — check RLS policy on 'users' table)";
      } else if(error && error.message){
        detail = ` (${error.code || ""} ${error.message})`;
      }
      msgEl.textContent = "Invalid username, password or role" + detail;
      return;
    }

    // Store the logged-in user for use elsewhere in the app + persist across refresh
    App.currentUser = { id: data.id, username: data.username, role: data.role };
    localStorage.setItem("loggedUser", JSON.stringify(data));

    document.getElementById("loginPage").style.display = "none";
    document.getElementById("app").style.display = "block";

    renderLoggedInUser();
  } catch(err){
    console.error("Login network/exception error:", err);
    msgEl.textContent = "Login failed: " + err.message;
  } finally {
    loginBtn.disabled = false;
    loginBtn.textContent = "Login";
  }
}

function logout(){
  App.currentUser = null;
  localStorage.removeItem("loggedUser");
  document.getElementById("app").style.display = "none";
  document.getElementById("loginPage").style.display = "flex";
  document.getElementById("username").value = "";
  document.getElementById("password").value = "";
  document.getElementById("loginMsg").textContent = "";
}

// Restore session on page refresh if a user is already logged in
function checkSavedSession(){
  const saved = localStorage.getItem("loggedUser");
  if(!saved) return;
  try{
    const data = JSON.parse(saved);

    document.getElementById("loginPage").style.display = "none";
    document.getElementById("app").style.display = "block";
    renderLoggedInUser();
  } catch(e){
    localStorage.removeItem("loggedUser");
  }
}

/* =====================================================================
   C2. ROLE / PERMISSION HELPERS (client-side gating)
   ADMIN     : full access (products, settings, reports, users)
   CASHIER   : can create sales + print receipts, cannot edit/delete products
   VIEW      : read-only, cannot modify anything, cannot create sales
   NOTE: this is a UI-level convenience layer. Real enforcement must
   also happen in Supabase via Row Level Security (see SQL notes).
   ===================================================================== */
const Perm = {
  role() {
    return (App.currentUser && App.currentUser.role) ? String(App.currentUser.role).toLowerCase() : 'view';
  },
  isAdmin() { return this.role() === 'admin'; },
  isCashier() { return this.role() === 'cashier'; },
  isViewOnly() { return this.role() === 'view'; },
  canManageProducts() { return this.isAdmin(); },
  canManageSettings() { return this.isAdmin(); },
  canManageUsers() { return this.isAdmin(); },
  canViewReports() { return true; }, // all logged-in roles may view reports
  canCreateSales() { return this.isAdmin() || this.isCashier(); },
  canDeleteSales() { return this.isAdmin(); },
  canAccessPOS() { return this.isAdmin() || this.isCashier(); }
};

/* =====================================================================
   C3. TRANSACTION SAVE SYSTEM (Supabase: transactions + transaction_items)
   Auto bill numbers are derived from the transactions table's own
   auto-increment "id" column (CZ-00001, CZ-00002, ...), which avoids
   race conditions that a client-side COUNT() would have.
   ===================================================================== */
async function saveTransactionToSupabase(sale) {
  try {
    const { data: inserted, error: insErr } = await db
      .from('transactions')
      .insert({
        total: sale.grandTotal,
        cash: sale.cash,
        balance: sale.balance
      })
      .select()
      .single();

    if (insErr || !inserted) {
      console.error('Transaction insert error:', insErr);
      return null;
    }

    const billNo = `${App.settings.invoicePrefix || 'CZ-'}${String(inserted.id).padStart(5, '0')}`;

    const { error: updErr } = await db
      .from('transactions')
      .update({ bill_no: billNo })
      .eq('id', inserted.id);
    if (updErr) console.error('Failed to set bill_no on transaction:', updErr);

    if (Array.isArray(sale.items) && sale.items.length) {
      const itemRows = sale.items.map(it => ({
        bill_id: inserted.id,
        product_name: it.name,
        qty: it.qty,
        price: it.price
      }));
      const { error: itemsErr } = await db.from('transaction_items').insert(itemRows);
      if (itemsErr) console.error('Failed to save transaction_items:', itemsErr);
    }

    return { billNo, transactionId: inserted.id };
  } catch (err) {
    console.error('saveTransactionToSupabase exception:', err);
    return null;
  }
}

async function loadAndRenderUsers() {
  const wrap = document.getElementById('userManagementList');
  if (!wrap) return;
  wrap.innerHTML = '<div class="text-sm text-muted">Loading users...</div>';
  try {
    const { data, error } = await db.from('users').select('id, username, role').order('username', { ascending: true });
    if (error) throw error;
    if (!data || !data.length) { wrap.innerHTML = '<div class="text-sm text-muted">No users found.</div>'; return; }
    wrap.innerHTML = `

          <tbody>
            ${data.map(u => `

                <td><button class="btn btn-ghost btn-icon btn-sm text-danger" data-deluser="${u.id}" title="Delete user">${icon('M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6h14z')}</button></td>
              </tr>`).join('')}
          </tbody>
        </table>
      </div>`;
    wrap.querySelectorAll('[data-deluser]').forEach(el => el.addEventListener('click', () => deleteUserAccount(el.getAttribute('data-deluser'))));
  } catch (err) {
    console.error('loadAndRenderUsers error:', err);

}

function deleteUserAccount(id) {
  if (!Perm.isAdmin()) { Toast.show('Only Admin can manage users', 'error'); return; }
  if (App.currentUser && String(App.currentUser.id) === String(id)) { Toast.show('You cannot delete your own account while logged in', 'error'); return; }
  confirmDialog('Delete User', 'Remove this user account? They will no longer be able to log in.', async () => {
    try {
      const { error } = await db.from('users').delete().eq('id', id);
      if (error) throw error;
      Toast.show('User deleted', 'success');
      loadAndRenderUsers();
    } catch (err) {
      console.error('deleteUserAccount error:', err);
      Toast.show('Failed to delete user: ' + err.message, 'error');
    }
  });
}

async function searchBillByBarcode(code) {
  if (!code) return;
  code = String(code).trim();
  if (!code) return;

  const localSale = App.sales.find(s => s.invoiceNo === code);
  if (localSale) { openReceiptModal(localSale); return; }

  try {
    const { data: txn, error: txnErr } = await db
      .from('transactions')
      .select('*')
      .eq('bill_no', code)
      .single();

    if (txnErr || !txn) {
      Toast.show('No bill found for ' + code, 'error');
      return;
    }

    const { data: items, error: itemsErr } = await db
      .from('transaction_items')
      .select('*')
      .eq('bill_id', txn.id);
    if (itemsErr) console.error('Failed to load transaction_items:', itemsErr);

    const saleItems = (items || []).map(i => ({
      name: i.product_name,
      qty: Number(i.qty) || 0,
      price: Number(i.price) || 0
    }));
    const subtotal = Utils.round2(saleItems.reduce((sum, i) => sum + i.price * i.qty, 0));

    const sale = {
      id: 'txn_' + txn.id,
      invoiceNo: txn.bill_no || code,
      createdAt: txn.created_at ? new Date(txn.created_at).getTime() : Date.now(),
      cashier: '',
      items: saleItems,
      subtotal,
      discount: 0,
      tax: 0,
      grandTotal: Number(txn.total) || 0,
      cash: Number(txn.cash) || 0,
      balance: Number(txn.balance) || 0
    };
    openReceiptModal(sale);
  } catch (err) {
    console.error('searchBillByBarcode exception:', err);
    Toast.show('Failed to search for bill: ' + err.message, 'error');
  }
}

/* ---------------------------------------------------------------------
   1. STORAGE MODULE
   --------------------------------------------------------------------- */
const DB_KEYS = {
  settings: 'companySettings',
  products: 'products',
  categories: 'categories',
  sales: 'sales',
  invoiceCounter: 'invoiceCounter',
  theme: 'theme'
};

const Store = {
  get(key, fallback) {
    try {
      const raw = localStorage.getItem(key);
      if (raw === null || raw === undefined) return fallback;
      return JSON.parse(raw);
    } catch (e) {
      console.error('Store.get error for', key, e);
      return fallback;
    }
  },
  set(key, value) {
    try {
      localStorage.setItem(key, JSON.stringify(value));
      return true;
    } catch (e) {
      console.error('Store.set error for', key, e);
      Toast.show('Storage error: ' + e.message, 'error');
      return false;
    }
  },
  remove(key) { localStorage.removeItem(key); }
};

/* ---------------------------------------------------------------------
   2. DEFAULT / SEED DATA
   --------------------------------------------------------------------- */

/* ---------------------------------------------------------------------
   4. UTILITIES
   --------------------------------------------------------------------- */
const Utils = {
  uid() {
    return 'id_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 9);
  },
  money(amount) {
    const n = Number(amount) || 0;
    const formatted = n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    return `${App.settings.currencySymbol || ''} ${formatted}`.trim();
  },
  round2(n) { return Math.round((Number(n) + Number.EPSILON) * 100) / 100; },
  escapeHtml(str) {
    if (str === undefined || str === null) return '';
    return String(str)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#039;');
  },
  formatDate(ts, withTime = true) {
    const d = new Date(ts);
    const dateStr = d.toLocaleDateString('en-GB'); // dd/mm/yyyy
    if (!withTime) return dateStr;
    const timeStr = d.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
    return `${dateStr} ${timeStr}`;
  },
  isSameDay(ts, refDate) {
    const a = new Date(ts), b = refDate;
    return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
  },
  isSameMonth(ts, refDate) {
    const a = new Date(ts), b = refDate;
    return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth();
  },
  isWithinLastDays(ts, days) {
    const now = Date.now();
    return ts >= now - days * 24 * 60 * 60 * 1000;
  },
  debounce(fn, wait = 250) {
    let t;
    return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), wait); };
  },
  downloadJSON(filename, dataObj) {
    const blob = new Blob([JSON.stringify(dataObj, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  },
  readFileAsText(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = reject;
      reader.readAsText(file);
    });
  },
  readFileAsDataURL(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }
};

   --------------------------------------------------------------------- */
const Toast = {
  container: null,
  init() {
    this.container = document.getElementById('toastContainer');
  },
  show(message, type = 'info', duration = 3200) {
    if (!this.container) this.container = document.getElementById('toastContainer');
    const icons = {
      success: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M20 6L9 17l-5-5"/></svg>',
      error: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M18 6L6 18M6 6l12 12"/></svg>',
      info: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>'
    };
    const el = document.createElement('div');
    el.className = `toast ${type} toast-in flex items-center gap-3`;
    const colorClass = type === 'success' ? 'text-success' : type === 'error' ? 'text-danger' : 'text-info';
    el.innerHTML = `<span class="${colorClass}">${icons[type] || icons.info}</span><span class="text-sm text-primary flex-1">${Utils.escapeHtml(message)}</span>`;
    this.container.appendChild(el);
    setTimeout(() => {
      el.style.transition = 'opacity .25s ease, transform .25s ease';
      el.style.opacity = '0'; el.style.transform = 'translateX(24px)';
      setTimeout(() => el.remove(), 250);
    }, duration);
  }
};

  if ((viewId === 'settings' || viewId === 'importexport') && !Perm.isAdmin()) {

  if (viewId === 'pos' && !Perm.canAccessPOS()) {

  }
  App.currentView = viewId;
  renderNavList();
  const titles = { dashboard: 'Dashboard', pos: 'POS Billing', products: 'Product Management', history: 'Sales History', reports: 'Reports', settings: 'Settings', importexport: 'Import / Export' };
  document.getElementById('viewTitle').textContent = titles[viewId] || '';
  const container = document.getElementById('viewContainer');
  container.classList.add('fade-in');
  switch (viewId) {
    case 'dashboard': renderDashboard(container); break;
    case 'pos': renderPOS(container); break;
    case 'products': renderProducts(container); break;
    case 'history': renderHistory(container); break;
    case 'reports': renderReports(container); break;
    case 'settings': renderSettings(container); break;
    case 'importexport': renderImportExport(container); break;
    default: container.innerHTML = '';
  }
}

function computeSaleTotals(sale) {
  // sale.items: [{productId,name,price,qty,buyPrice}]
  const revenue = sale.grandTotal;
  const cost = sale.items.reduce((sum, it) => sum + (it.buyPrice || 0) * it.qty, 0);
  const profit = revenue - cost;
  return { revenue, cost, profit };
}

            </div>
            <div style="grid-column: span 2;">

              <div class="flex items-center gap-3">
                <div class="w-16 h-16 rounded-md overflow-hidden bg-surface-3 flex items-center justify-center flex-none" id="pf_imagePreviewWrap">
                  ${p && p.image ? `<img src="${p.image}" class="w-full h-full object-cover" id="pf_imagePreview">` : `<span id="pf_imagePreview">${icon('M4 7h16v13H4zM8 7V4h8v3')}</span>`}
                </div>

            </div>

          ${p ? `<button class="btn btn-danger mr-auto" id="pf_deleteBtn">Delete</button>` : ''}

        </div>
      </div>

    if (!file) return;
    newImageData = await Utils.readFileAsDataURL(file);
    document.getElementById('pf_imagePreviewWrap').innerHTML = `<img src="${newImageData}" class="w-full h-full object-cover">`;

  document.getElementById('pf_saveBtn').addEventListener('click', async () => {

    if (isNaN(sellPrice) || sellPrice < 0) { Toast.show('Valid selling price is required', 'error'); return; }

      name,
      category: document.getElementById('pf_category').value,
      sku: document.getElementById('pf_sku').value.trim(),
      barcode: document.getElementById('pf_barcode').value.trim(),
      stock: parseInt(document.getElementById('pf_stock').value) || 0,

      sellPrice,
      lowStock: parseInt(document.getElementById('pf_lowStock').value) || 0,
      image: newImageData || ''
    };

    const saveBtn = document.getElementById('pf_saveBtn');
    saveBtn.disabled = true;
    const originalLabel = saveBtn.textContent;
    saveBtn.textContent = 'Saving...';

    if (p) {
      Object.assign(p, data);

      const inserted = await addProductToSupabase(data);
      if (!inserted) {
        saveBtn.disabled = false;
        saveBtn.textContent = originalLabel;
        return;
      }
      App.products.push({ id: String(inserted.id), ...data, createdAt: Date.now() });
      Toast.show('Product added', 'success');
    }

    Store.set(DB_KEYS.products, App.products);
    close();
    if (App.currentView === 'products') renderProductsTable();
    if (App.currentView === 'pos') renderPOSGrid();
  });
}

function deleteProduct(id) {
  if (!Perm.canManageProducts()) { Toast.show('You do not have permission to delete products', 'error'); return; }
  const p = App.products.find(x => x.id === id);
  if (!p) return;
  confirmDialog('Delete Product', `Are you sure you want to delete "${p.name}"? This cannot be undone.`, async () => {
    await deleteProductSupabase(id);
    App.products = App.products.filter(x => x.id !== id);
    Store.set(DB_KEYS.products, App.products);
    Toast.show('Product deleted', 'success');
    if (App.currentView === 'products') renderProductsTable();
    if (App.currentView === 'pos') renderPOSGrid();
  });
}

function renderPOSGrid() {
  const grid = document.getElementById('posProductGrid');
  if (!grid) return;

    const matchesTerm = !term || p.name.toLowerCase().includes(term) || (p.barcode || '').toLowerCase().includes(term) || (p.sku || '').toLowerCase().includes(term);

function addToCart(productId) {
  const product = App.products.find(p => p.id === productId);
  if (!product) return;
  if (product.stock <= 0) { Toast.show(`${product.name} is out of stock`, 'error'); return; }
  const existing = App.cart.find(c => c.productId === productId);
  if (existing) {
    if (existing.qty + 1 > product.stock) { Toast.show('Not enough stock available', 'error'); return; }
    existing.qty += 1;
  } else {
    App.cart.push({ productId, name: product.name, price: product.sellPrice, buyPrice: product.buyPrice, qty: 1, stock: product.stock });
  }
  renderCart();
}

function changeCartQty(productId, delta) {
  const item = App.cart.find(c => c.productId === productId);
  if (!item) return;
  const product = App.products.find(p => p.id === productId);
  const newQty = item.qty + delta;
  if (newQty <= 0) { App.cart = App.cart.filter(c => c.productId !== productId); renderCart(); return; }
  if (product && newQty > product.stock) { Toast.show('Not enough stock available', 'error'); return; }
  item.qty = newQty;
  renderCart();
}

function removeCartItem(productId) {
  App.cart = App.cart.filter(c => c.productId !== productId);
  renderCart();
}

function getCartTotals() {
  const subtotal = Utils.round2(App.cart.reduce((sum, it) => sum + it.price * it.qty, 0));
  let discountAmount = 0;
  if (App.cartDiscount.type === 'percent') discountAmount = Utils.round2(subtotal * (App.cartDiscount.value / 100));
  else discountAmount = Utils.round2(App.cartDiscount.value);
  discountAmount = Math.min(discountAmount, subtotal);
  const afterDiscount = subtotal - discountAmount;
  const taxPercent = App.settings.taxPercent || 0;
  const taxAmount = Utils.round2(afterDiscount * (taxPercent / 100));
  const grandTotal = Utils.round2(afterDiscount + taxAmount);
  return { subtotal, discountAmount, taxAmount, grandTotal };
}

        <button class="btn btn-ghost btn-icon btn-sm text-danger" data-remove="${it.productId}">${icon('M18 6L6 18M6 6l12 12')}</button>
      </div>`).join('');
    list.querySelectorAll('[data-qty-plus]').forEach(el => el.addEventListener('click', () => changeCartQty(el.getAttribute('data-qty-plus'), 1)));
    list.querySelectorAll('[data-qty-minus]').forEach(el => el.addEventListener('click', () => changeCartQty(el.getAttribute('data-qty-minus'), -1)));
    list.querySelectorAll('[data-remove]').forEach(el => el.addEventListener('click', () => removeCartItem(el.getAttribute('data-remove'))));
  }

  const totals = getCartTotals();
  document.getElementById('cartSubtotal').textContent = Utils.money(totals.subtotal);
  document.getElementById('cartTax').textContent = Utils.money(totals.taxAmount);
  document.getElementById('cartGrandTotal').textContent = Utils.money(totals.grandTotal);
  updateBalanceOnly();
}

function updateBalanceOnly() {
  const totals = getCartTotals();
  const cashInput = document.getElementById('cashReceived');
  const cash = cashInput ? (parseFloat(cashInput.value) || 0) : 0;
  const balanceEl = document.getElementById('cartBalance');
  if (!balanceEl) return;
  const balance = Utils.round2(cash - totals.grandTotal);
  balanceEl.textContent = Utils.money(balance);
  balanceEl.className = 'font-bold ' + (balance < 0 ? 'text-danger' : 'text-success');
}

function cancelSale() {
  if (!App.cart.length) return;
  confirmDialog('Cancel Sale', 'This will clear the current cart. Continue?', () => {
    App.cart = [];
    App.cartDiscount = { type: 'amount', value: 0 };
    renderCart();
    document.getElementById('discountValue').value = 0;
    document.getElementById('cashReceived').value = '';
    Toast.show('Sale cancelled', 'info');
  });
}

async function completeSale() {
  if (!Perm.canCreateSales()) { Toast.show('You do not have permission to create sales', 'error'); return; }
  if (!App.cart.length) { Toast.show('Cart is empty', 'error'); return; }
  const totals = getCartTotals();
  const cashInputEl = document.getElementById('cashReceived');
  const cash = parseFloat(cashInputEl ? cashInputEl.value : 0) || 0;
  if (cash < totals.grandTotal) { Toast.show('Cash received is less than grand total', 'error'); return; }

  // Validate stock again
  for (const it of App.cart) {
    const product = App.products.find(p => p.id === it.productId);
    if (!product || product.stock < it.qty) { Toast.show(`Insufficient stock for ${it.name}`, 'error'); return; }
  }

  const completeBtn = document.getElementById('completeSaleBtn');
  if (completeBtn) { completeBtn.disabled = true; completeBtn.textContent = 'Processing...'; }

  const sale = {
    id: Utils.uid(),
    invoiceNo: '',
    createdAt: Date.now(),
    cashier: (App.currentUser && App.currentUser.username) || App.settings.cashierName || 'Admin',
    items: App.cart.map(it => ({ productId: it.productId, name: it.name, price: it.price, qty: it.qty, buyPrice: it.buyPrice })),
    subtotal: totals.subtotal,
    discount: totals.discountAmount,
    tax: totals.taxAmount,
    grandTotal: totals.grandTotal,
    cash,
    balance: Utils.round2(cash - totals.grandTotal)
  };

  // 1) Save the transaction + its items into Supabase (transactions / transaction_items)
  let saved = null;
  try {
    saved = await saveTransactionToSupabase(sale);
  } catch (err) {
    console.error('completeSale: saveTransactionToSupabase threw:', err);
    saved = null;
  }

  if (saved && saved.billNo) {
    sale.invoiceNo = saved.billNo;
    sale.transactionId = saved.transactionId;
  } else {
    // Offline / DB-error fallback so the cashier is never blocked mid-sale
    sale.invoiceNo = `${App.settings.invoicePrefix || 'CZ-'}${String(App.invoiceCounter).padStart(5, '0')}`;
    Toast.show('Could not reach the database — sale saved locally only', 'error');
  }

  // 2) Deduct stock locally and keep Supabase in sync
  App.cart.forEach(it => {
    const product = App.products.find(p => p.id === it.productId);
    if (product) {
      product.stock -= it.qty;
      updateProductSupabase(product);
    }
  });
  Store.set(DB_KEYS.products, App.products);

  App.sales.push(sale);
  Store.set(DB_KEYS.sales, App.sales);
  App.invoiceCounter += 1;
  Store.set(DB_KEYS.invoiceCounter, App.invoiceCounter);

  App.lastCompletedSale = sale;
  App.cart = [];
  App.cartDiscount = { type: 'amount', value: 0 };
  renderCart();
  const discountValueEl = document.getElementById('discountValue');
  if (discountValueEl) discountValueEl.value = 0;
  if (cashInputEl) cashInputEl.value = '';
  renderPOSGrid();

  if (completeBtn) { completeBtn.disabled = false; completeBtn.textContent = 'Complete Sale (F4)'; }

  Toast.show(`Sale ${sale.invoiceNo} completed`, 'success');
  openReceiptModal(sale);
}

function getSalesInRange(range) {
  const now = new Date();
  if (range === 'today') return App.sales.filter(s => Utils.isSameDay(s.createdAt, now));
  if (range === 'week') return App.sales.filter(s => Utils.isWithinLastDays(s.createdAt, 7));
  if (range === 'month') return App.sales.filter(s => Utils.isSameMonth(s.createdAt, now));
  return App.sales;
}

function renderReports(container) {
  container.innerHTML = `
    <div class="slide-up">
      <div class="flex gap-2 mb-4" id="reportRangeChips"></div>
      <div id="reportBody"></div>
    </div>`;
  const ranges = [['today', "Today"], ['week', 'Weekly'], ['month', 'Monthly']];
  const chipWrap = document.getElementById('reportRangeChips');
  chipWrap.innerHTML = ranges.map(([id, label]) => `<div class="chip ${App.reportRange === id ? 'active' : ''}" data-range="${id}">${label}</div>`).join('');
  chipWrap.querySelectorAll('[data-range]').forEach(el => el.addEventListener('click', () => {
    App.reportRange = el.getAttribute('data-range');
    chipWrap.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
    el.classList.add('active');
    renderReportBody();
  }));
  renderReportBody();
}

function renderReportBody() {
  const body = document.getElementById('reportBody');
  const sales = getSalesInRange(App.reportRange);

  let revenue = 0, cost = 0;
  const productQty = {}; const categoryRevenue = {}; const hourly = new Array(24).fill(0);
  sales.forEach(s => {
    const t = computeSaleTotals(s);
    revenue += t.revenue; cost += t.cost;
    hourly[new Date(s.createdAt).getHours()] += s.grandTotal;
    s.items.forEach(it => {
      productQty[it.name] = (productQty[it.name] || 0) + it.qty;
      const prod = App.products.find(p => p.name === it.name);
      const catName = prod ? (prod.category || 'Other') : 'Other';
      categoryRevenue[catName] = (categoryRevenue[catName] || 0) + it.price * it.qty;
    });
  });
  const profit = revenue - cost;
  const avgSale = sales.length ? revenue / sales.length : 0;
  const sortedProducts = Object.entries(productQty).sort((a, b) => b[1] - a[1]);
  const topProducts = sortedProducts.slice(0, 5);
  const leastProducts = sortedProducts.slice(-5).reverse();
  const maxHourly = Math.max(...hourly, 1);
  const maxCatRev = Math.max(...Object.values(categoryRevenue), 1);

  const statCard = (label, value, colorClass = 'text-accent') => `
    <div class="stat-card">
      <div class="text-xs text-muted uppercase tracking-wide font-semibold mb-1">${label}</div>
      <div class="text-xl font-extrabold ${colorClass}">${value}</div>
    </div>`;

  body.innerHTML = `
    <div class="grid grid-cols-4 gap-4 mb-6">
      ${statCard('Revenue', Utils.money(revenue))}
      ${statCard('Profit', Utils.money(profit), 'text-success')}
      ${statCard('Transactions', sales.length)}
      ${statCard('Average Sale', Utils.money(avgSale))}
    </div>

    <div class="grid grid-cols-3 gap-4 mb-4">
      <div class="card p-4" style="grid-column: span 2;">
        <h3 class="font-bold text-primary mb-3">Hourly Sales</h3>
        <div class="flex items-end gap-1" style="height:140px;">
          ${hourly.map((v, h) => `
            <div class="flex-1 flex flex-col items-center justify-end" title="${h}:00 — ${Utils.money(v)}">
              <div class="w-full rounded-sm bg-accent" style="height:${v ? Math.max((v / maxHourly * 100), 3) : 1}%; opacity:${v ? 1 : .15};"></div>
            </div>`).join('')}
        </div>
        <div class="flex justify-between text-xs text-muted mt-2"><span>12am</span><span>6am</span><span>12pm</span><span>6pm</span><span>11pm</span></div>
      </div>
      <div class="card p-4">
        <h3 class="font-bold text-primary mb-3">Category Sales</h3>
        ${Object.keys(categoryRevenue).length === 0 ? emptyState('No data', 'No sales in range.') : `
        <div class="space-y-3">
          ${Object.entries(categoryRevenue).sort((a, b) => b[1] - a[1]).map(([cat, rev]) => `
            <div>
              <div class="flex justify-between text-sm mb-1"><span class="text-secondary truncate">${Utils.escapeHtml(cat)}</span><span class="font-semibold">${Utils.money(rev)}</span></div>
              <div class="w-full rounded-full bg-surface-3" style="height:6px;"><div class="rounded-full bg-accent" style="height:6px; width:${(rev / maxCatRev * 100).toFixed(0)}%;"></div></div>
            </div>`).join('')}
        </div>`}
      </div>
    </div>

    <div class="grid grid-cols-2 gap-4">
      <div class="card p-4">
        <h3 class="font-bold text-primary mb-3">Most Sold Products</h3>
        ${topProducts.length === 0 ? emptyState('No data', 'No sales in range.') : `
        <div class="table-wrap"><table class="data-table"><thead><tr><th>Product</th><th>Qty Sold</th></tr></thead>
        <tbody>${topProducts.map(([n, q]) => `<tr><td>${Utils.escapeHtml(n)}</td><td class="font-semibold">${q}</td></tr>`).join('')}</tbody></table></div>`}
      </div>
      <div class="card p-4">
        <h3 class="font-bold text-primary mb-3">Least Sold Products</h3>
        ${leastProducts.length === 0 ? emptyState('No data', 'No sales in range.') : `
        <div class="table-wrap"><table class="data-table"><thead><tr><th>Product</th><th>Qty Sold</th></tr></thead>
        <tbody>${leastProducts.map(([n, q]) => `<tr><td>${Utils.escapeHtml(n)}</td><td class="font-semibold">${q}</td></tr>`).join('')}</tbody></table></div>`}
      </div>
    </div>
  `;
}

            <label class="label">Cashier Name</label>
            <input class="input" id="st_cashier" value="${Utils.escapeHtml(s.cashierName || '')}">
          </div>
        </div>
      </div>

      <div class="card p-5 mb-4">
        <h3 class="font-bold text-primary mb-4">Billing & Currency</h3>
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="label">Currency Symbol</label>
            <input class="input" id="st_currency" value="${Utils.escapeHtml(s.currencySymbol)}">
          </div>
          <div>
            <label class="label">Tax Percentage (%)</label>
            <input type="number" min="0" step="0.01" class="input" id="st_tax" value="${s.taxPercent}">
          </div>
          <div>
            <label class="label">Invoice Prefix</label>
            <input class="input" id="st_invoicePrefix" value="${Utils.escapeHtml(s.invoicePrefix)}">
          </div>
          <div>
            <label class="label">Invoice Counter (next number)</label>
            <input type="number" min="1" class="input" id="st_invoiceCounter" value="${App.invoiceCounter}">
          </div>
          <div>
            <label class="label">Receipt Size</label>
            <select class="input" id="st_receiptSize">
              <option value="58mm" ${s.receiptSize === '58mm' ? 'selected' : ''}>58mm</option>
              <option value="80mm" ${s.receiptSize === '80mm' ? 'selected' : ''}>80mm</option>
              <option value="A4" ${s.receiptSize === 'A4' ? 'selected' : ''}>A4</option>
            </select>
          </div>
          <div>
            <label class="label">Default Theme</label>
            <select class="input" id="st_defaultTheme">
              <option value="dark" ${s.defaultTheme === 'dark' ? 'selected' : ''}>Dark</option>
              <option value="light" ${s.defaultTheme === 'light' ? 'selected' : ''}>Light</option>
            </select>
          </div>
          <div style="grid-column: span 2;">
            <label class="label">Receipt Footer Message</label>
            <textarea class="input" id="st_footer" rows="2">${Utils.escapeHtml(s.receiptFooter)}</textarea>
          </div>
        </div>
      </div>

      <div class="card p-5 mb-4">
        <h3 class="font-bold text-primary mb-4">Categories</h3>
        <div class="flex flex-wrap gap-2 mb-3" id="categoryChipsSettings"></div>
        <div class="flex gap-2">
          <input class="input" id="newCategoryInput" placeholder="New category name">
          <button class="btn btn-outline" id="addCategoryBtn">Add</button>
        </div>
      </div>

      ${Perm.isAdmin() ? `
      <div class="card p-5 mb-4">
        <h3 class="font-bold text-primary mb-2">User Management</h3>
        <p class="text-sm text-muted mb-3">Admin only. Add or remove login accounts (roles: admin, cashier, view).</p>
        <div id="userManagementList" class="mb-3"></div>
        <div class="grid grid-cols-3 gap-2">
          <input class="input" id="um_username" placeholder="Username">
          <input class="input" id="um_password" type="password" placeholder="Password">
          <select class="input" id="um_role">
            <option value="admin">Admin</option>
            <option value="cashier" selected>Cashier</option>
            <option value="view">View Only</option>
          </select>
        </div>
        <button class="btn btn-outline w-full mt-2" id="um_addUserBtn">Add User</button>
      </div>` : ''}

      <button class="btn btn-primary btn-lg w-full" id="saveSettingsBtn">${icon('M20 6L9 17l-5-5')} Save Settings</button>
    </div>
  `;

  if (Perm.isAdmin()) {
    loadAndRenderUsers();
    const addUserBtn = document.getElementById('um_addUserBtn');
    if (addUserBtn) addUserBtn.addEventListener('click', async () => {
      const username = document.getElementById('um_username').value.trim();
      const password = document.getElementById('um_password').value;
      const role = document.getElementById('um_role').value;
      if (!username || !password) { Toast.show('Username and password are required', 'error'); return; }
      try {
        const { error } = await db.from('users').insert({ username, password, role });
        if (error) throw error;
        Toast.show('User added', 'success');
        document.getElementById('um_username').value = '';
        document.getElementById('um_password').value = '';
        loadAndRenderUsers();
      } catch (err) {
        console.error('Add user error:', err);
        Toast.show('Failed to add user: ' + err.message, 'error');
      }
    });
  }

  let newLogo = s.logo || '';
  const logoInput = document.getElementById('st_logoInput');
  if (logoInput) logoInput.addEventListener('change', async (e) => {
    const file = e.target.files[0]; if (!file) return;
    newLogo = await Utils.readFileAsDataURL(file);
    document.getElementById('st_logoPreviewWrap').innerHTML = `<img src="${newLogo}" class="w-full h-full object-cover">`;
  });
  const logoRemoveBtn = document.getElementById('st_logoRemove');
  if (logoRemoveBtn) logoRemoveBtn.addEventListener('click', () => { newLogo = ''; document.getElementById('st_logoPreviewWrap').innerHTML = icon('M4 7h16v13H4zM8 7V4h8v3'); });

  renderCategoryChipsSettings();
  document.getElementById('addCategoryBtn').addEventListener('click', () => {
    const val = document.getElementById('newCategoryInput').value.trim();
    if (!val) return;
    if (App.categories.includes(val)) { Toast.show('Category already exists', 'error'); return; }
    App.categories.push(val);
    Store.set(DB_KEYS.categories, App.categories);
    document.getElementById('newCategoryInput').value = '';
    renderCategoryChipsSettings();
    Toast.show('Category added', 'success');
  });

  document.getElementById('saveSettingsBtn').addEventListener('click', () => {
    App.settings = {
  ...App.settings,
  companyName: document.getElementById('st_companyName').value.trim() || 'CAFE ZONE',
  logo: newLogo,
  address: document.getElementById('st_address').value.trim(),
  phone: document.getElementById('st_phone').value.trim(),
  cashierName: document.getElementById('st_cashier').value.trim(),
  currencySymbol: document.getElementById('st_currency').value.trim(),
  taxPercent: parseFloat(document.getElementById('st_tax').value) || 0,
  invoicePrefix: document.getElementById('st_invoicePrefix').value.trim(),
  receiptSize: document.getElementById('st_receiptSize').value,
  defaultTheme: document.getElementById('st_defaultTheme').value,
  receiptFooter: document.getElementById('st_footer').value
};
    Store.set(DB_KEYS.settings, App.settings);
    const newCounter = parseInt(document.getElementById('st_invoiceCounter').value) || App.invoiceCounter;
    App.invoiceCounter = newCounter;
    Store.set(DB_KEYS.invoiceCounter, App.invoiceCounter);
    renderSidebarBrand();
    Toast.show('Settings saved', 'success');
  });
}

function renderCategoryChipsSettings() {
  const wrap = document.getElementById('categoryChipsSettings');
  if (!wrap) return;
  wrap.innerHTML = App.categories.map(c => `
    <span class="chip active" style="gap:.5rem;">${Utils.escapeHtml(c)}
      <span data-remove-cat="${Utils.escapeHtml(c)}" style="cursor:pointer; margin-left:.3rem;">✕</span>
    </span>`).join('');
  wrap.querySelectorAll('[data-remove-cat]').forEach(el => el.addEventListener('click', () => {
    const cat = el.getAttribute('data-remove-cat');
    App.categories = App.categories.filter(c => c !== cat);
    Store.set(DB_KEYS.categories, App.categories);
    renderCategoryChipsSettings();
  }));
}

/* ---------------------------------------------------------------------
   17. IMPORT / EXPORT
   --------------------------------------------------------------------- */
function renderImportExport(container) {
  if (!Perm.isAdmin()) {
    container.innerHTML = emptyState('Access Denied', 'Only Admin users can access Import / Export.');
    return;
  }
  container.innerHTML = `
    <div class="slide-up grid grid-cols-2 gap-4" style="max-width:900px;">
      <div class="card p-5">
        <h3 class="font-bold text-primary mb-2">Export Products</h3>
        <p class="text-sm text-muted mb-3">Download all products as a JSON file.</p>
        <button class="btn btn-outline w-full" id="exportProductsBtn">Export Products JSON</button>
      </div>
      <div class="card p-5">
        <h3 class="font-bold text-primary mb-2">Import Products</h3>
        <p class="text-sm text-muted mb-3">Restore or merge products from a JSON file.</p>
        <input type="file" accept=".json" class="input" id="importProductsInput">
      </div>
      <div class="card p-5">
        <h3 class="font-bold text-primary mb-2">Export Sales</h3>
        <p class="text-sm text-muted mb-3">Download all sales records as a JSON file.</p>
        <button class="btn btn-outline w-full" id="exportSalesBtn">Export Sales JSON</button>
      </div>
      <div class="card p-5">
        <h3 class="font-bold text-primary mb-2">Full System Backup</h3>
        <p class="text-sm text-muted mb-3">Backup everything: products, sales, settings, categories.</p>
        <button class="btn btn-primary w-full" id="fullBackupBtn">Download Full Backup</button>
      </div>
      <div class="card p-5">
        <h3 class="font-bold text-primary mb-2">Restore Backup</h3>
        <p class="text-sm text-muted mb-3">Restore from a full backup JSON file. This replaces all current data.</p>
        <input type="file" accept=".json" class="input" id="restoreBackupInput">
      </div>
      <div class="card p-5 border-danger" style="border-color:var(--danger);">
        <h3 class="font-bold text-danger mb-2">Reset Everything</h3>
        <p class="text-sm text-muted mb-3">Permanently erase all data and restore factory defaults.</p>
        <button class="btn btn-danger w-full" id="resetAllBtn">Reset Everything</button>
      </div>
    </div>
  `;

  document.getElementById('exportProductsBtn').addEventListener('click', () => {
    Utils.downloadJSON(`products_${Date.now()}.json`, App.products);
    Toast.show('Products exported', 'success');
  });
  document.getElementById('exportSalesBtn').addEventListener('click', () => {
    Utils.downloadJSON(`sales_${Date.now()}.json`, App.sales);
    Toast.show('Sales exported', 'success');
  });
  document.getElementById('fullBackupBtn').addEventListener('click', () => {
    const backup = {
      settings: App.settings, products: App.products, categories: App.categories,
      sales: App.sales, invoiceCounter: App.invoiceCounter, exportedAt: Date.now()
    };
    Utils.downloadJSON(`cafezone_backup_${Date.now()}.json`, backup);
    Toast.show('Full backup downloaded', 'success');
  });

  document.getElementById('importProductsInput').addEventListener('change', async (e) => {
    const file = e.target.files[0]; if (!file) return;
    try {
      const text = await Utils.readFileAsText(file);
      const data = JSON.parse(text);
      if (!Array.isArray(data)) throw new Error('Invalid products file');
      confirmDialog('Import Products', `Import ${data.length} products? This will be merged with existing products.`, () => {
        data.forEach(p => { if (!p.id) p.id = Utils.uid(); });
        App.products = [...App.products, ...data];
        Store.set(DB_KEYS.products, App.products);
        Toast.show('Products imported', 'success');
      }, { danger: false, confirmLabel: 'Import' });
    } catch (err) { Toast.show('Failed to import: ' + err.message, 'error'); }
    e.target.value = '';
  });

  document.getElementById('restoreBackupInput').addEventListener('change', async (e) => {
    const file = e.target.files[0]; if (!file) return;
    try {
      const text = await Utils.readFileAsText(file);
      const data = JSON.parse(text);
      confirmDialog('Restore Backup', 'This will replace ALL current data (products, sales, settings). Continue?', () => {
        if (data.settings) { App.settings = data.settings; Store.set(DB_KEYS.settings, App.settings); }
        if (data.products) { App.products = data.products; Store.set(DB_KEYS.products, App.products); }
        if (data.categories) { App.categories = data.categories; Store.set(DB_KEYS.categories, App.categories); }
        if (data.sales) { App.sales = data.sales; Store.set(DB_KEYS.sales, App.sales); }
        if (data.invoiceCounter) { App.invoiceCounter = data.invoiceCounter; Store.set(DB_KEYS.invoiceCounter, App.invoiceCounter); }
        Toast.show('Backup restored — reloading...', 'success');
        setTimeout(() => window.location.reload(), 1000);
      });
    } catch (err) { Toast.show('Failed to restore: ' + err.message, 'error'); }
    e.target.value = '';
  });

  document.getElementById('resetAllBtn').addEventListener('click', () => {
    confirmDialog('Reset Everything', 'This will permanently erase ALL data and restore factory defaults. This cannot be undone.', () => {
      Object.values(DB_KEYS).forEach(k => Store.remove(k));
      Toast.show('All data reset — reloading...', 'success');
      setTimeout(() => window.location.reload(), 900);
    }, { confirmLabel: 'Yes, Reset' });
  });
}

/* ---------------------------------------------------------------------
   18. KEYBOARD SHORTCUTS
   --------------------------------------------------------------------- */
function bindGlobalShortcuts() {
 document.addEventListener('keydown', (e) => {

    // ESC - Close Modals
    if (e.key === 'Escape') {
        document.getElementById('modalRoot').innerHTML = '';
        document.getElementById('confirmDialogRoot').innerHTML = '';
    }

    // F2 - POS Screen
    if (e.key === 'F2') {
        e.preventDefault();
        navigate('pos');
    }

    // F4 - Complete Sale
    if (e.key === 'F4') {
        if (App.currentView === 'pos') {
            e.preventDefault();
            completeSale();
        }
    }

    // Search
    if (e.key === '/' &&
        document.activeElement.tagName !== 'INPUT' &&
        document.activeElement.tagName !== 'TEXTAREA') {

        if (App.currentView === 'pos') {
            e.preventDefault();
            document.getElementById('posSearchInput')?.focus();
        }
    }

    // Ctrl + Shift + R = Reset Everything
    if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 'r') {
        e.preventDefault();

        if (confirm('⚠️ Reset EVERYTHING?\n\nAll products, customers, sales history, settings, invoice numbers and all saved data will be permanently deleted.')) {

            localStorage.clear();

            alert('✅ All data has been reset successfully.');

            location.reload();
        }
    }

});
}

   19. BOOT
   --------------------------------------------------------------------- */
document.addEventListener('DOMContentLoaded', () => {

    initApp();

    checkSavedSession();

});
  </script>
